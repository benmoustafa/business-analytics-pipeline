version: "3.8"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@warehouse/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    WAREHOUSE_URL: postgresql://postgres:postgres@warehouse:5432/warehouse
    _PIP_ADDITIONAL_REQUIREMENTS: "dbt-core dbt-postgres kaggle pandas pyarrow sqlalchemy psycopg2-binary"
  volumes:
    - ./orchestration/dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion
    - ./dbt:/opt/airflow/dbt
    - ./data:/opt/airflow/data
  depends_on:
    warehouse:
      condition: service_healthy

services:
  # --- Data warehouse (also hosts the Airflow metadata DB, in a separate database) ---
  warehouse:
    image: postgres:16
    container_name: warehouse
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: "warehouse,airflow"
    ports:
      - "5432:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  # --- Airflow init (runs once on first start: DB migration + admin user) ---
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db init &&
        airflow users create
        --username admin --password admin
        --firstname Admin --lastname User
        --role Admin --email admin@example.com
    restart: "no"

  # --- Airflow webserver (UI at localhost:8080) ---
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # --- Airflow scheduler (picks up and runs DAG tasks) ---
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # --- Streamlit dashboard ---
  dashboard:
    build: ./dashboard
    container_name: dashboard
    environment:
      WAREHOUSE_URL: postgresql://postgres:postgres@warehouse:5432/warehouse
    ports:
      - "8501:8501"
    depends_on:
      warehouse:
        condition: service_healthy

  # --- FastAPI prediction serving ---
  api:
    build: ./api
    container_name: api
    environment:
      WAREHOUSE_URL: postgresql://postgres:postgres@warehouse:5432/warehouse
    ports:
      - "8000:8000"
    depends_on:
      warehouse:
        condition: service_healthy

volumes:
  warehouse_data:
