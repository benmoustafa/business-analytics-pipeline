version: 2

models:
  - name: stg_orders
    description: "Light-cleaned orders — one row per order."
    columns:
      - name: order_id
        description: "Unique order identifier"
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: order_status
        tests:
          - not_null
      - name: purchase_ts
        tests:
          - not_null

  - name: stg_customers
    description: "Customer master with location data."
    columns:
      - name: customer_id
        description: "Unique customer-per-order identifier"
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "True unique customer (one person may have multiple customer_ids)"
        tests:
          - not_null
      - name: state
        tests:
          - not_null

  - name: stg_order_items
    description: "Line items within each order."
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: order_item_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: seller_id
        tests:
          - not_null
      - name: price
        tests:
          - not_null

  - name: stg_order_payments
    description: "Payment details per order — may have multiple rows per order."
    columns:
      - name: order_id
        tests:
          - not_null
      - name: payment_sequential
        tests:
          - not_null
      - name: payment_type
        tests:
          - not_null
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']
      - name: payment_value
        tests:
          - not_null

  - name: stg_order_reviews
    description: "Customer review scores and comments."
    columns:
      - name: review_id
        tests:
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: review_score
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]

  - name: stg_products
    description: "Product catalogue with physical dimensions."
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: stg_sellers
    description: "Seller master with location data."
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null
      - name: state
        tests:
          - not_null

  - name: stg_category_translation
    description: "Portuguese → English product category name lookup."
    columns:
      - name: product_category_name
        tests:
          - unique
          - not_null
      - name: category_name_english
        tests:
          - not_null
