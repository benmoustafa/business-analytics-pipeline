name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    name: Lint & Validate

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint Python (flake8)
        run: |
          flake8 ingestion/ --max-line-length 120 --ignore E501,W503

      - name: Validate Python files compile
        run: |
          python -m py_compile ingestion/extract.py
          python -m py_compile ingestion/load.py
          python -m py_compile ingestion/load_to_warehouse.py
          python -m py_compile ingestion/schemas.py
          python -m py_compile api/main.py

      - name: Validate dbt project
        run: |
          pip install dbt-core dbt-postgres
          cd dbt && dbt parse --profiles-dir . || echo "dbt parse requires a running database — skipping full parse"

      - name: Check schema definitions match CSV count
        run: |
          python -c "
          from ingestion.schemas import DATASET_SCHEMAS
          assert len(DATASET_SCHEMAS) == 9, f'Expected 9 schemas, got {len(DATASET_SCHEMAS)}'
          print('✅ All 9 dataset schemas defined')
          "
